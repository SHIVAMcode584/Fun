<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fun.com</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #243b55);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #cffff3;
      min-height: 100vh;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    header {
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #7fffd4;
    }
    .auth {
      font-size: 0.9rem;
      opacity: 0.95;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .auth span {
      font-size: 1.2rem;
    }
    .hero {
      text-align: center;
      padding: 30px 20px 10px;
    }
    .search-box {
      margin: 20px auto 35px;
      max-width: 520px;
      display: flex;
      gap: 10px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 28px;
      border: none;
      outline: none;
    }
    .search-box button {
      padding: 12px 22px;
      border-radius: 28px;
      border: none;
      background: #7fffd4;
      font-weight: 600;
      cursor: pointer;
    }
    .menu-grid {
      padding: 30px 20px 50px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 28px;
      max-width: 1000px;
      margin: auto;
    }
    .menu-card {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(127,255,212,0.45);
      border-radius: 18px;
      height: 170px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
      color: #7fffd4;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .menu-card:hover {
      background: rgba(127,255,212,0.18);
      transform: translateY(-6px);
    }
    footer {
      text-align: center;
      padding: 18px;
      font-size: 1rem;
      color: rgba(127, 255, 212, 0.6);
      margin-top: 40px;
    }
  @media (max-width: 768px) {
      header h1 { font-size: 1.5rem; }
      .search-box { max-width: 100%; padding: 0 10px; }
      .menu-card { height: 150px; font-size: 1rem; }
    }

    @media (max-width: 480px) {
      header { justify-content: center; gap: 10px; }
      .auth { font-size: 0.85rem; }
      .menu-grid { gap: 20px; }
      .menu-card { height: 140px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Fun.com</h1>
    <div class="auth" id = 'login-btn'><span>👤</span> Login | Signup</div>
  </header>

  <section class="hero">
    <div class="search-box">
      <input type="text" placeholder="Search fun content...">
      <button>Go</button>
    </div>
  </section>

  <section class="menu-grid">
    <div class="menu-card" id="meme-finder">Meme Finder</div>
    <div class="menu-card" id = 'randomJoke'>Random Joke</div>
    <div class="menu-card" id = 'love-cal'>Love Calculator</div>
    <div class="menu-card" id = 'dowry-cal'>Dowry Calculator</div>
    <div class="menu-card">Coming soon</div>
    <div class="menu-card" id = 'pickup-line'>Pickup Line Generator</div>
  </section>

  <footer>
    Designed for fun • Fun.com 😄
  </footer>


  <script>
    const loginbtn = document.getElementById('login-btn');
    loginbtn.addEventListener('click', () => {
        window.location.href = "login.html";
    });
    const memeFinder = document.getElementById('meme-finder');
    memeFinder.addEventListener('click', () => {
        window.location.href = "../meme/meme.html";
    });
    const randomJoke = document.getElementById('randomJoke');
    randomJoke.addEventListener('click', () => {
        window.location.href = "../Joke finder/jokefetch.html";
    });

    const lovecal = document.getElementById('love-cal');
    lovecal.addEventListener('click', () => {
        window.location.href = "../love-calculator/love-cal.html";
    });

    const pickupline = document.getElementById('pickup-line');
    pickupline.addEventListener('click', () => {
        window.location.href = "../pickupline/pickup.html";
    });


  </script>
</body>
</html>
